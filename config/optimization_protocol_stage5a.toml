schema_version = 1
protocol_id = "ctr-positional-design-optimisation"
protocol_version = "1.0.0-draft.6"
methodology_stage = "5A"
status = "frozen-for-local-computational-pilot-not-manufacturing-certified"

[scope]
primary_endpoint = "inner"
secondary_endpoints = ["middle", "outer"]
secondary_endpoint_role = "report-only-no-equal-weighted-combination"
included_quantities = [
  "common-task-region-coverage",
  "positional-isotropy",
  "spatial-isotropy-uniformity",
  "fixed-start-numerical-ik-residual",
  "fixed-start-poor-convergence-fraction",
]
excluded_quantities = [
  "tip-orientation",
  "force-capability",
  "loaded-stiffness-capability",
  "collision-contact-and-buckling",
  "clinical-safety-or-success",
]

[baseline_evidence]
parameter_set_id = "supervisor-nominal-2026-08-29"
parameter_sha256 = "dea553b3c01ff204403a052436e7959c167ebd061b0c192b65133d129c2055b3"
stage4_run = "results/evaluation/ctr-eval-v1/baseline_extension_20260830_e576f056_30c927c2"
stage4_protocol_sha256 = "e576f056902d99e3612f2f19047391f9366a7482d6e1f8899e2cae0aab91894a"
